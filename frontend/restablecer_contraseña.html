<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña - SIGRE</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f3ff;
            color: #19365b;
        }
        main {
            width: 100%;
            max-width: 440px;
            padding: 32px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 35px #1b28551a;
        }
        h1 { color: #5b4bd8; font-size: 25px; }
        p { line-height: 1.5; color: #65758b; }
        label { display: block; margin: 20px 0 8px; font-weight: bold; }
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d6def0;
            border-radius: 9px;
            font-size: 16px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: 0;
            border-radius: 25px;
            background: #5b4bd8;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        #mensaje { margin-top: 16px; overflow-wrap: anywhere; }
        a { color: #5b4bd8; }
    </style>
</head>
<body>
    <main>
        <h1>Crear nueva contraseña</h1>
        <p>La contraseña debe tener entre 12 y 128 caracteres.</p>

        <form id="form-restablecer">
            <label for="password">Nueva contraseña</label>
            <input
                type="password"
                id="password"
                minlength="12"
                maxlength="128"
                autocomplete="new-password"
                required
            >

            <label for="confirmar">Confirmar contraseña</label>
            <input
                type="password"
                id="confirmar"
                minlength="12"
                maxlength="128"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="guardar">Cambiar contraseña</button>
        </form>

        <p id="mensaje" role="status" aria-live="polite"></p>
        <a href="login.html">Volver al inicio de sesión</a>
    </main>

    <script>
        const API = "http://127.0.0.1:5000";

        document.getElementById("form-restablecer")
            .addEventListener("submit", async (evento) => {
                evento.preventDefault();

                const mensaje = document.getElementById("mensaje");
                const boton = document.getElementById("guardar");
                const password = document.getElementById("password").value;
                const confirmar = document.getElementById("confirmar").value;
                const token = new URLSearchParams(location.search).get("token");

                if (!token) {
                    mensaje.textContent = "El enlace no contiene un token de recuperación.";
                    return;
                }

                if (password !== confirmar) {
                    mensaje.textContent = "Las contraseñas no coinciden.";
                    return;
                }

                if (password.length < 12 || password.length > 128) {
                    mensaje.textContent = "Usa entre 12 y 128 caracteres.";
                    return;
                }

                boton.disabled = true;

                try {
                    const respuesta = await fetch(
                        `${API}/api/auth/restablecer`,
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ token, password })
                        }
                    );

                    const datos = await respuesta.json();

                    if (!respuesta.ok) {
                        throw new Error(datos.error || "No se pudo cambiar la contraseña.");
                    }

                    document.getElementById("form-restablecer").reset();
                    mensaje.textContent =
                        "Contraseña actualizada. Ya puedes iniciar sesión.";
                } catch (error) {
                    mensaje.textContent = error.message.includes("token")
                        ? error.message
                        : "No se pudo completar el cambio. Comprueba la conexión e inténtalo de nuevo.";
                } finally {
                    boton.disabled = false;
                }
            });
    </script>
</body>
</html>
