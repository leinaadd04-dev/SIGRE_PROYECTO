<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SIGRE</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <section class="seccion_login">
        <div class="login_contenedor">

            <!-- COLUMNA IZQUIERDA: formulario -->
            <div class="login_izquierda">

                <!-- HEADER: fondo oscuro con onda + logo -->
                <div class="login_header">

                    <div class="login_logo">
                        <img src="imagenes/logo.png" alt="SIGRE" class="logo_imagen">
                    </div>

                    <h1 class="login_titulo">SIGRE</h1>

                    <p class="login_subtitulo">
                        Sistema Integral de Gestión<br>y Respuesta ante Emergencias
                    </p>

                </div>

                <!-- CUERPO: fondo claro con el formulario -->
                <div class="login_cuerpo">

                    <h2>Bienvenido de nuevo</h2>
                    <p class="login_descripcion">Inicia sesión para continuar</p>

                    <!-- Mensajes de error / éxito -->
                    <div class="mensaje_error" id="error-msg"></div>
                    <div class="mensaje_exito" id="exito-msg"></div>

                    <form id="form_login">

                        <!-- Campo correo -->
                        <div class="campo_login">
                            <label for="email">Correo electrónico</label>
                            <div class="campo_con_icono">
                                <span class="icono_campo"><i data-lucide="mail"></i></span>
                                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                            </div>
                        </div>

                        <!-- Campo contraseña -->
                        <div class="campo_login">
                            <label for="password">Contraseña</label>
                            <div class="campo_con_icono">
                                <span class="icono_campo"><i data-lucide="lock"></i></span>
                                <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                                <button type="button" class="ojo" id="toggle-password">
                                    <i data-lucide="eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Enlace olvidé contraseña -->
                        <p class="olvide">
                            <a href="recuperar_contrasena.html">¿Olvidaste tu contraseña?</a>
                        </p>

                        <!-- Botón de envío -->
                        <button type="submit" class="boton_login">Iniciar Sesión</button>

                    </form>

                    <!-- Divisor -->
                    <div class="divisor">
                        <span>o continúa con</span>
                    </div>

                    <!-- Botón de Google -->
                    <button type="button" class="boton_google">
                        <svg class="icono_google" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18" height="18">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                        </svg>
                        Continuar con Google
                    </button>

                    <!-- Enlace al registro -->
                    <p class="enlace_secundario_form">
                        ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
                    </p>

                </div>

            </div>

            <!-- COLUMNA DERECHA: ilustración -->
            <div class="login_derecha">
                <img src="imagenes/imglogin.png" alt="SIGRE" class="login_ilustracion">
            </div>

        </div>
    </section>

    <script>
        lucide.createIcons();
    </script>

    <script src="js/auth.js"></script>

</body>
</html>
